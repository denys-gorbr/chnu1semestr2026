    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-green: #4ade80;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .settings-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px 16px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-sizing: border-box;
        }

        .settings-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .select-box {
            display: flex;
            gap: 8px;
        }

        select {
            flex: 1;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .widget {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .day-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .time-now {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .block {
            margin-bottom: 16px;
        }

        .block-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .lesson-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .meta-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .auditory {
            color: var(--accent-green);
            font-weight: 600;
        }

        .countdown {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 12px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

        const daysMap = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const daysUa = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];

        function getStudyWeek(date) {
            const startOfYear = new Date(date.getFullYear(), 0, 1);
            const days = Math.floor((date - startOfYear) / (24 * 60 * 60 * 1000));
            const weekNumber = Math.ceil((days + startOfYear.getDay() + 1) / 7);
            return (weekNumber % 2 === 0) ? "2" : "1";
        }

        let savedSub7 = localStorage.getItem('selectedSub7') || "143(1)";
        let savedSub5 = localStorage.getItem('selectedSub5') || "група 1";
        
        document.getElementById('sub7-select').value = savedSub7;
        document.getElementById('sub5-select').value = savedSub5;

        function changeSettings() {
            savedSub7 = document.getElementById('sub7-select').value;
            savedSub5 = document.getElementById('sub5-select').value;
            localStorage.setItem('selectedSub7', savedSub7);
            localStorage.setItem('selectedSub5', savedSub5);
            updateWidget();
        }

        function parseTime(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            const d = new Date();
            d.setHours(h, m, 0, 0);
            return d;
        }

        function updateWidget() {
            const now = new Date();
            
            document.getElementById('clock').innerText = 
                String(now.getHours()).padStart(2, '0') + ":" + 
                String(now.getMinutes()).padStart(2, '0') + ":" + 
                String(now.getSeconds()).padStart(2, '0');

            const dayIndex = now.getDay(); 
            const dayNameEng = daysMap[dayIndex];
            document.getElementById('current-day').innerText = daysUa[dayIndex];

            const currentWeekType = getStudyWeek(now);
            document.getElementById('week-type').innerText = currentWeekType + "-й навчальний тиждень";

            let currentLessonObj = null;
            let nextLessonObj = null;
            let timerLabel = "До початку пар:";
            let targetTime = null;

            function findLessonForSlot(slotNumber) {
                const lessons7 = timetable[savedSub7]?.[currentWeekType]?.[dayNameEng] || [];
                let lesson = lessons7.find(l => l.number === slotNumber);
                
                if (lesson) {
                    if (lesson.subject.includes('[група')) {
                        if (!lesson.subject.toLowerCase().includes('[' + savedSub5.toLowerCase() + ']')) {
                            return null; 
                        }
                    }
                    return lesson;
                }

                for (const subKey in timetable) {
                    const altLessons = timetable[subKey]?.[currentWeekType]?.[dayNameEng] || [];
                    const altLesson = altLessons.find(l => l.number === slotNumber);
                    if (altLesson) {
                        if (altLesson.subject.includes('[ЛЕКЦІЯ]')) {
                            return altLesson; 
                        }
                        if (altLesson.subject.includes('[група') && altLesson.subject.toLowerCase().includes('[' + savedSub5.toLowerCase() + ']')) {
                            return altLesson;
                        }
                    }
                }
                return null;
            }

            for (let i = 0; i < lessonsTime.length; i++) {
                const slot = lessonsTime[i];
                const start = parseTime(slot.start);
                const end = parseTime(slot.end);

                if (now >= start && now <= end) {
                    currentLessonObj = findLessonForSlot(slot.number);
                    targetTime = end;
                    timerLabel = "До кінця пари:";
                    
                    for (let j = i + 1; j < lessonsTime.length; j++) {
                        nextLessonObj = findLessonForSlot(lessonsTime[j].number);
                        if (nextLessonObj) break;
                    }
                    break;
                } else if (now < start) {
                    nextLessonObj = findLessonForSlot(slot.number);
                    if (nextLessonObj) {
                        targetTime = start;
                        timerLabel = "До початку пари:";
                        break;
                    }
                }
            }

            if (!nextLessonObj && now > parseTime(lessonsTime[lessonsTime.length - 1].end)) {
                timerLabel = "Пари на сьогодні завершено";
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('timer-label').innerText = timerLabel;
            } else {
                document.getElementById('countdown').style.display = 'block';
                document.getElementById('timer-label').innerText = timerLabel;
            }

            if (currentLessonObj) {
                document.getElementById('current-lesson').innerText = "(" + currentLessonObj.number + ") " + currentLessonObj.subject;
                document.getElementById('current-auditory').innerText = currentLessonObj.auditory;
                document.getElementById('current-teacher').innerText = currentLessonObj.teacher;
            } else {
                document.getElementById('current-lesson').innerText = "Немає пари (перерва/вікно)";
                document.getElementById('current-auditory').innerText = "--";
                document.getElementById('current-teacher').innerText = "--";
            }

            if (nextLessonObj) {
                document.getElementById('next-lesson').innerText = "(" + nextLessonObj.number + ") " + nextLessonObj.subject;
                document.getElementById('next-auditory').innerText = nextLessonObj.auditory;
                document.getElementById('next-teacher').innerText = nextLessonObj.teacher;
            } else {
                document.getElementById('next-lesson').innerText = "Немає";
                document.getElementById('next-auditory').innerText = "--";
                document.getElementById('next-teacher').innerText = "--";
            }

            if (targetTime) {
                const diff = targetTime - now;
                if (diff > 0) {
                    const mins = Math.floor(diff / 1000 / 60);
                    const secs = Math.floor((diff / 1000) % 60);
                    document.getElementById('countdown').innerText = 
                        String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
                }
            }
        }

        updateWidget();
        setInterval(updateWidget, 1000);
    </script>
